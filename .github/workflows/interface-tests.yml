name: Native interface tests
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/interface-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run recitation and daily-content interface tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --max-workers=2 '-Pandroid.testInstrumentationRunnerArguments.class=com.msoumaya.androidcoran.RecitationSharingDialogTest,com.msoumaya.androidcoran.RecitationPlaybackControlsTest,com.msoumaya.androidcoran.RecitationDeleteDialogTest,com.msoumaya.androidcoran.InvocationRecordingLinkTest,com.msoumaya.androidcoran.TodayContentCarouselTest,com.msoumaya.androidcoran.ReaderFullscreenTest,com.msoumaya.androidcoran.ConversationTypingIndicatorTest,com.msoumaya.androidcoran.LearningReminderTest,com.msoumaya.androidcoran.ChapterAudioServiceTest,com.msoumaya.androidcoran.GoalDeadlineScreenTest,com.msoumaya.androidcoran.AvatarCropAndroidTest' connectedDebugAndroidTest
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AndroidCoran-interface-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
